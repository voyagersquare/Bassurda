name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxext-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev xvfb

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Run DSP tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a ./build/BassurdaTests_artefacts/Release/BassurdaTests

      - name: Run DSP tests (macOS)
        if: runner.os == 'macOS'
        run: ./build/BassurdaTests_artefacts/Release/BassurdaTests

      - name: Run DSP tests (Windows)
        if: runner.os == 'Windows'
        run: .\build\BassurdaTests_artefacts\Release\BassurdaTests.exe

      - name: Upload plugin
        uses: actions/upload-artifact@v5
        with:
          name: Bassurda-${{ matrix.name }}
          path: |
            build/Bassurda_artefacts/Release/VST3
            build/Bassurda_artefacts/Release/AU
            build/Bassurda_artefacts/Release/Standalone
          if-no-files-found: error
