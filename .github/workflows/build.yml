name: Build Windows VST3

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish releases for version tags

jobs:
  windows-vst3:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3 and tests
        run: cmake --build build --config Release --parallel 4 --target Bassurda_VST3 BassurdaTests

      - name: Run DSP tests
        run: .\build\BassurdaTests_artefacts\Release\BassurdaTests.exe

      - name: Upload VST3
        uses: actions/upload-artifact@v5
        with:
          name: Bassurda-Windows-VST3
          path: build/Bassurda_artefacts/Release/VST3
          if-no-files-found: error

      # Publish the plugin as a GitHub Release (version taken from CMakeLists.txt).
      # The newest release is always at
      # https://github.com/voyagersquare/Bassurda/releases/latest/download/Bassurda-Windows-VST3.zip
      - name: Zip VST3
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/bass-engine' || startsWith(github.ref, 'refs/tags/v'))
        shell: pwsh
        run: Compress-Archive -Path build/Bassurda_artefacts/Release/VST3/Bassurda.vst3 -DestinationPath Bassurda-Windows-VST3.zip

      - name: Publish release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/bass-engine' || startsWith(github.ref, 'refs/tags/v'))
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -nE 's/^project\(Bassurda VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          tag="v${version}"
          cat > notes.md <<'NOTES'
          Bassurda - hip-hop / trap / drill bass synth (Windows VST3, 64-bit).

          **Instalacija:** raspakiraj zip i kopiraj mapu `Bassurda.vst3` u
          `C:\Program Files\Common Files\VST3`, zatim u DAW-u ponovno skeniraj pluginove.
          NOTES
          echo "Built from commit ${GITHUB_SHA::7}." >> notes.md
          if gh release view "$tag" > /dev/null 2>&1; then
            # same version rebuilt: replace the zip and the notes
            gh release upload "$tag" Bassurda-Windows-VST3.zip --clobber
            gh release edit "$tag" --notes-file notes.md
          else
            gh release create "$tag" Bassurda-Windows-VST3.zip \
              --title "Bassurda $tag" --notes-file notes.md --target "$GITHUB_SHA" --latest
          fi
