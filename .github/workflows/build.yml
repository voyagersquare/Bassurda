name: Build Windows VST3

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish releases

jobs:
  windows-vst3:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(sed -nE 's/^project\(Bassurda VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3 and tests
        run: cmake --build build --config Release --parallel 4 --target Bassurda_VST3 BassurdaTests

      - name: Run DSP tests
        run: .\build\BassurdaTests_artefacts\Release\BassurdaTests.exe

      - name: Validate with pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          $p = Start-Process -FilePath .\pluginval\pluginval.exe -Wait -PassThru -NoNewWindow -ArgumentList `
                 '--strictness-level','5','--validate-in-process','--validate','build\Bassurda_artefacts\Release\VST3\Bassurda.vst3'
          if ($p.ExitCode -ne 0) { throw "pluginval failed with exit code $($p.ExitCode)" }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" "/DVST3Dir=..\build\Bassurda_artefacts\Release\VST3" installer\Bassurda.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Zip VST3
        shell: pwsh
        run: Compress-Archive -Path build/Bassurda_artefacts/Release/VST3/Bassurda.vst3 -DestinationPath Bassurda-Windows-VST3.zip

      - name: Upload build
        uses: actions/upload-artifact@v5
        with:
          name: Bassurda-Windows
          path: |
            installer/Output/Bassurda-Windows-Setup.exe
            Bassurda-Windows-VST3.zip
          if-no-files-found: error

      # Publish as a GitHub Release (version from CMakeLists.txt). The newest is always at
      # https://github.com/voyagersquare/Bassurda/releases/latest/download/Bassurda-Windows-Setup.exe
      - name: Publish release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/bass-engine' || startsWith(github.ref, 'refs/tags/v'))
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          cp installer/Output/Bassurda-Windows-Setup.exe .
          cat > notes.md <<'NOTES'
          Bassurda - hip-hop / trap / drill bass synth (Windows VST3, 64-bit).

          **Installer:** pokreni `Bassurda-Windows-Setup.exe`. Plugin ide u `C:\Program Files\Common Files\VST3`,
          a vlastiti preseti i samplovi su u `Dokumenti\Bassurda`. Zatvori DAW prije instalacije, pa ponovno skeniraj pluginove.

          **Bez installera:** raspakiraj `Bassurda-Windows-VST3.zip` i kopiraj mapu `Bassurda.vst3` u
          `C:\Program Files\Common Files\VST3`.
          NOTES
          echo "" >> notes.md
          echo "Built from commit ${GITHUB_SHA::7}; tests and pluginval passed." >> notes.md
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" Bassurda-Windows-Setup.exe Bassurda-Windows-VST3.zip --clobber
            gh release edit "$tag" --notes-file notes.md
          else
            gh release create "$tag" Bassurda-Windows-Setup.exe Bassurda-Windows-VST3.zip \
              --title "Bassurda $tag" --notes-file notes.md --target "$GITHUB_SHA" --latest
          fi
