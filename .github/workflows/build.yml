name: Build Windows VST3

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows-vst3:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3 and tests
        run: cmake --build build --config Release --parallel 4 --target Bassurda_VST3 BassurdaTests

      - name: Run DSP tests
        run: .\build\BassurdaTests_artefacts\Release\BassurdaTests.exe

      - name: Upload VST3
        uses: actions/upload-artifact@v5
        with:
          name: Bassurda-Windows-VST3
          path: build/Bassurda_artefacts/Release/VST3
          if-no-files-found: error
